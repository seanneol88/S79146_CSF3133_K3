<!DOCTYPE html>
<!--
    CSF3133 Lab Module 5 - Cascading Style Sheets (CSS) Part 2
    Section 5.4 Internal CSS (page 41)
    Styles collected in a <style> element inside <head>.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Internal CSS</title>
    <style>
        h1 {
            color: green;
            text-align: center;
        }

        p {
            background-color: #f0f0f0;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Welcome to Internal CSS!</h1>
    <p>This paragraph is styled using Internal CSS.</p>
</body>
</html>
