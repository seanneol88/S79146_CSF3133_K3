<!DOCTYPE html>
<!--
    CSF3133 Lab Module 5 - Cascading Style Sheets (CSS) Part 2
    Section 5.3 Inline CSS (page 41)
    Styles written straight onto the element with the style attribute.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inline CSS</title>
</head>
<body>
    <h1 style="color: blue; font-size: 24px;">
        Welcome to Inline CSS!</h1>
    <p style="background-color: yellow; padding: 10px;">
        This paragraph is styled using Inline CSS.</p>
</body>
</html>
