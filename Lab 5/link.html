<!DOCTYPE html>
<!--
    CSF3133 Lab Module 5 - Section 5.6 Link to file CSS (from another website)
    (pages 43-44). The style sheet lives on Google's servers, so the page only
    holds a <link> to it; the font is swapped for a different weight below.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Google Fonts Example</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            text-align: center;
        }

        h1 {
            font-weight: 700;
        }
    </style>
</head>
<body>
    <h1>Hello, World!</h1>
    <p>This is styled using Google Fonts.</p>
</body>
</html>
