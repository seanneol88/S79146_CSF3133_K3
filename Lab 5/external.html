<!DOCTYPE html>
<!--
    CSF3133 Lab Module 5 - Section 5.5 External CSS (pages 42-43)
    The module's sample code links href="styles.css" while the step before it
    asks you to create style.css. The style sheet is the source of truth here,
    so this page links style.css.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>External CSS</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <h1>Welcome to External CSS!</h1>
    <p>This paragraph is styled using External CSS.</p>
</body>
</html>
