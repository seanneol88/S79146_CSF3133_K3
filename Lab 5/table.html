<!DOCTYPE html>
<!--
    CSF3133 Lab Module 5 - Section 5.8 CSS Table (pages 46-48)
    The module's #customers sheet, kept exactly as listed: single borders,
    zebra rows, a hover row and an uppercase white-on-teal header.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSS Table</title>
    <style>
        #customers {
            font-family: Arial, Helvetica, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }

        #customers td, #customers th {
            border: 1px solid #ddd;
            padding: 8px;
        }

        #customers tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        #customers tr:hover {
            background-color: #faf79f;
        }

        #customers th {
            padding-top: 12px;
            text-transform: uppercase;
            padding-bottom: 12px;
            text-align: center;
            background-color: #08d38c;
            color: white;
        }

        body {
            margin: 24px;
        }
    </style>
</head>
<body>
    <h1>Customers</h1>

    <table id="customers">
        <tr>
            <th>Company</th>
            <th>Contact</th>
            <th>Country</th>
        </tr>
        <tr>
            <td>Alfreds Futterkiste</td>
            <td>Maria Anders</td>
            <td>Germany</td>
        </tr>
        <tr>
            <td>Ernst Handel</td>
            <td>Roland Mendel</td>
            <td>Austria</td>
        </tr>
        <tr>
            <td>Island Trading</td>
            <td>Helen Bennett</td>
            <td>UK</td>
        </tr>
        <tr>
            <td>Magazzini Riuniti</td>
            <td>Giovanni Rovelli</td>
            <td>Italy</td>
        </tr>
    </table>
</body>
</html>
