<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML5 Input Attributes</title>
</head>
<body>

    <!-- Demonstrating the new HTML5 input attributes:
         placeholder = grey hint text shown while the box is empty
         autofocus   = the cursor starts blinking in this box
         required    = the form refuses to submit while empty
         autocomplete = the browser offers previously typed values -->

    <h1>Club Sign-Up Form</h1>
    <form>

        <label for="member">Member Name:</label>
        <!-- This box grabs the cursor on page load (autofocus)
             and the browser remembers past entries (autocomplete) -->
        <input type="text" id="member" name="member"
               placeholder="Type the member name here"
               autofocus autocomplete="on">
        <br><br>

        <label for="guardian">Guardian Name:</label>
        <!-- required: try submitting with this box empty and watch
             the browser block the submit with a warning -->
        <input type="text" id="guardian" name="guardian"
               placeholder="Type the guardian name here"
               required>
        <br><br>

        <input type="submit" value="Save">
    </form>

    <!-- Experiments to try:
         1. Refresh the page - which box is already focused?
         2. Leave Guardian Name empty and press Save - what happens?
         3. Fill in a name, save, refresh, then type its first letter -
            does autocomplete suggest it? -->
