              quirks mode  ->  <!DOCTYPE html>
           2. <html> had no lang attribute  ->  lang="en"
           3. the character encoding was never declared, so the
              validator guessed windows-1252  ->  <meta charset="utf-8">
           4. the document had no <head> metadata beyond a title,
              so a viewport line is added for phones as well.
         This file validates with "No errors or warnings to show".
         ==================================================== -->
