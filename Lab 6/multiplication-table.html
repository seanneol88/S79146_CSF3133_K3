<!DOCTYPE html>
<!--
    CSF3133 Lab Module 6 - Section 6.9 Multiplication Table (pages 62-64)
    Two number inputs feed generateTable() in multiplication-table.js, which
    builds a rows-by-columns table as a string and drops it into #tableContainer.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Multiplication Table</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }

        h2 {
            color: #333;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 12px;
        }

        th, td {
            border: 1px solid #ddd;
            text-align: center;
            padding: 8px;
        }

        th {
            background-color: #f2f2f2;
        }

        input, button {
            padding: 10px;
            margin: 5px 0;
        }

        button {
            cursor: pointer;
        }

        h1 {
            font-size: 1.6rem;
            margin: 0 0 18px;
            color: #1F2933;
        }
    </style>
</head>
<body>
    <h1>Multiplication Table</h1>
    <h2>Multiplication Table Generator</h2>

    <label for="rows">Enter number of rows:</label>
    <input type="number" id="rows" min="1" placeholder="Rows">
    <br>
    <label for="columns">Enter number of columns:</label>
    <input type="number" id="columns" min="1" placeholder="Columns">
    <br>
    <button type="button" onclick="generateTable()">Generate Table</button>
    <br><br>
    <div id="tableContainer"></div>

    <script src="multiplication-table.js"></script>
</body>
</html>
