<!DOCTYPE html>
<!--
    CSF3133 Lab Module 6 - Section 6.10.2 Numeric Input Validation
    (pages 67-69). Empty, non-numeric, out-of-range and valid input each
    get their own message from numeric-validation.js.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Numeric Input Validation</title>
    <!-- Add basic styling -->
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            padding: 8px;
            width: 300px;
        }

        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        h1 {
            font-size: 1.6rem;
            margin: 0 0 18px;
            color: #1F2933;
        }
    </style>
</head>
<body>
    <h1>Numeric Validation</h1>
    <h2>Numeric Input Validation Example</h2>

    <form name="numericForm" onsubmit="return validateNumericInput()">
        <div class="form-group">
            <label for="age">Enter Your Age:</label>
            <input type="text" id="age" name="age" placeholder="Enter a number">
        </div>
        <button type="submit">Submit</button>
    </form>

    <!-- Include JavaScript -->
    <script src="numeric-validation.js"></script>
</body>
</html>
