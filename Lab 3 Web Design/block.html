<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Block and Inline Elements</title>
</head>
<body>

    <!-- ===== Section 1: BLOCK elements =====
         Block elements always start on a new line and stretch
         across the full width of the page -->
    <h1>Block Elements</h1>
    <div>This box is a block element</div>
    <p>Paragraphs are block elements too.</p>
    <ul>
        <li>First list item</li>
        <li>Second list item</li>
    </ul>

    <hr>

    <!-- ===== Section 2: INLINE elements =====
         Inline elements stay on the same line and only take up
         as much width as their content needs -->
    <h2>Inline Elements</h2>
    <span>This span is an inline element.</span>
    <a href="#">This link is an inline element.</a>
    <strong>This bold text is an inline element.</strong>

    <!-- Notice in the browser: block elements stack on separate
         lines, while the inline elements above share one line -->

</body>
</html>
