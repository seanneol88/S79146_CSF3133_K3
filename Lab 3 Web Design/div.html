<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Layout with div</title>
</head>
<body>

    <!-- Organizing a webpage into sections using <div> blocks
         styled with inline styles: background-color, width,
         height, text-align and float -->

    <!-- Header block across the top -->
    <div id="header" style="background-color: lightblue; text-align: center; height: 80px">
        <h1>My Campus Page</h1>
    </div>

    <!-- Navigation block under the header -->
    <div id="nav" style="background-color: khaki; height: 30px">
        Navigation Bar
    </div>

    <!-- Main content block floated to the left, 70% wide -->
    <div id="content" style="background-color: honeydew; float: left; width: 70%; height: 200px">
        Main Content Area
    </div>

    <!-- Sidebar block floated to the right, 30% wide -->
    <div id="sidebar" style="background-color: lavender; float: right; width: 30%; height: 200px">
        Sidebar Content
    </div>

    <!-- Footer block; clear stops it sliding beside the floats -->
    <div id="footer" style="background-color: lightgray; text-align: center; clear: both; height: 50px">
        Footer Section
    </div>

    <!-- Try changing the width, height, text-align and float
         values above and watch the layout change -->

</body>
</html>
