<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Class Selector</title>
    <!-- A class selector starts with a dot and styles EVERY element
         that shares that class name -->
    <style>
        .center {
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Both elements carry class="center", so both sit in the
         middle of the page -->
    <h1 class="center">Main Title</h1>
    <p class="center">This paragraph shares the same class.</p>
    <p>This one has no class, so it stays left-aligned.</p>

</body>
</html>
