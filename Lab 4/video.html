<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video in HTML5</title>
</head>
<body>

    <!-- The <video> tag embeds video in HTML5.
         - Always set width and height so the browser reserves
           enough space for the player.
         - "controls" shows the play/pause buttons.
         - The text inside shows only for browsers with no
           video support.
         Supported formats: MP4, WebM and Ogg.
         Keep the video file in the SAME folder as this page. -->
    <h1>My Campus Video</h1>
    <video width="400" height="300" controls>
        <source src="campus.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Try changing the width and height values and note how
         the space the browser reserves changes -->

</body>
</html>
