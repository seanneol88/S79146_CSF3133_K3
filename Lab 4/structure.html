<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Semantic Page Structure</title>
</head>
<body>

    <!-- header: top part of the page, can also hold a logo image -->
    <header>
        This is the header area. A logo or banner image can go here.
    </header>

    <!-- First content section -->
    <section id="1">
        <h2>This is section 1.</h2>
    </section>

    <!-- Second content section -->
    <section id="2">
        <h2>This is section 2.</h2>
    </section>

    <!-- Third section: demo of the <meter> gauge element -->
    <section id="3">
        <h2>This is section 3.</h2>
        <p>Below is an example of the meter element:</p>
        <meter min="0" max="100" value="20">20</meter>
    </section>

    <!-- footer with a copyright entity and <address> contact block -->
    <footer>
        &copy; All rights reserved.
        <address>
            Contact us at <a href="mailto:myemail@umt.edu.my">my email</a>.
        </address>
    </footer>

</body>
</html>
