<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ID Selector</title>
    <!-- An ID selector starts with # and styles ONE unique element
         on the page (the element whose id matches) -->
    <style>
        #intro {
            text-align: center;
            color: crimson;
        }
    </style>
</head>
<body>

    <!-- Only this paragraph matches the rule, because it carries
         id="intro"; the other paragraph keeps the default style -->
    <p id="intro">Hello UMT!</p>
    <p>This paragraph has no id, so it is not styled.</p>

</body>
</html>
