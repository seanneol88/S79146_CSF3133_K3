<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My First CSS</title>
    <!-- Internal CSS: a <style> block in the <head>.
         p is the SELECTOR; color and text-align are PROPERTIES;
         blue and center are the VALUES -->
    <style>
        p {
            color: blue;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Every <p> on this page turns blue and centres itself,
         because one CSS rule styles them all at once -->
    <p>Hello UMT!</p>
    <p>CSS makes styling easy - change the rule above once and
       all paragraphs update together.</p>

</body>
</html>
